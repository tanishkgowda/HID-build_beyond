[project]
name = "hid-kiosk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=2,<3",
  "opencv-contrib-python>=5.0,<6",
  "mediapipe==0.10.32",
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
